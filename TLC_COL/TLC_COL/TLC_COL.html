<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLC COL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
    <h1 class="text-center">TLC COL</h1>
  </header>

  <!-- Menú -->
  <ul class="nav nav-pills justify-content-center mb-3" id="menuTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" data-endpoint="general">General</a>
    </li>
    <li class="nav-item dropdown">
      <a class="nav-link dropdown-toggle" id="dropdownTratados" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">
        Tratados
      </a>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#" data-endpoint="canada">Canadá</a></li>
        <li><a class="dropdown-item" href="#" data-endpoint="caricom">Caricom</a></li>
        <li><a class="dropdown-item" href="#" data-endpoint="costarica">Costa Rica</a></li>
        <li><a class="dropdown-item" href="#" data-endpoint="cuba">Cuba</a></li>
        <li><a class="dropdown-item" href="#" data-endpoint="efta">EFTA</a></li>
        <li><a class="dropdown-item" href="#" data-endpoint="panama">Panamá</a></li>
        <li><a class="dropdown-item" href="#" data-endpoint="ue">Unión Europea</a></li>
      </ul>
    </li>
  </ul>

  <main class="container">
    <input type="search" id="busqueda" class="form-control mb-3" placeholder="Introduce tu código..." enabled>
    <div id="resultado" style="display: none;">
      <p><strong>Información encontrada:</strong></p>
      <div id="info"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const busqueda = document.getElementById("busqueda");
    const menu = document.getElementById("menuTabs");
    const dropdownTratados = document.getElementById("dropdownTratados");

    // Manejo de clicks en el menú
    menu.addEventListener("click", function(e) {
      if (e.target.matches(".nav-link, .dropdown-item")) {
        e.preventDefault();

        // Quitar activo en todos
        document.querySelectorAll(".nav-link, .dropdown-item").forEach(el => el.classList.remove("active"));

        // Marcar el seleccionado
        e.target.classList.add("active");

        // Habilitar la barra de búsqueda
        busqueda.disabled = false;

        // (Opcional) aquí podrías cargar datos del endpoint seleccionado
        const endpoint = e.target.dataset.endpoint;
        console.log("Seleccionado:", endpoint);

        // Si el click fue en un tratado del menú desplegable
        if (e.target.classList.contains("dropdown-item")) {
          dropdownTratados.textContent = e.target.textContent; // Cambia el texto del menú principal
        } else {
          dropdownTratados.textContent = "Tratados"; // Si se vuelve a "General", restaura
        }
      }
    });
  </script>

  <script src="analizar.js"></script>
</body>
</html>
